<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Today's Kural</title>
<script src="athikarams-data.js?v=2.0"></script>
<script src="languages.js?v=2.0"></script>
<script src="language.js?v=2.0"></script>
<script src="today-kural.js?v=2.0"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Palatino Linotype', Palatino, Georgia, serif;
    background: #fff9f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  h1 { color: #e06b00; font-size: 1.3rem; font-weight: bold; margin-bottom: 4px; text-align: center; }
  .subtitle { color: #888; font-size: 0.82rem; margin-bottom: 20px; text-align: center; }
  .card {
    background: #fff9f0; border: 2px solid #c8964a; border-radius: 14px;
    box-shadow: 0 0 0 6px #fff9f0, 0 0 0 8px #c8964a, 0 0 0 13px #fff9f0;
    padding: 22px 20px; width: 100%; max-width: 420px; margin-bottom: 20px; text-align: center;
  }
  .pill { display:inline-block; background:#e06b00; color:#fff; font-size:0.75rem; font-weight:bold; border-radius:999px; padding:4px 16px; margin-bottom:12px; }
  .chapter-ta { color:#e06b00; font-size:1.05rem; font-weight:bold; margin-bottom:2px; }
  .chapter-en { color:#595959; font-size:0.82rem; font-style:italic; margin-bottom:12px; }
  hr { border:none; border-top:1px solid rgba(200,150,74,0.35); margin:10px 0; }
  .tamil { color:#4a2500; font-size:1.25rem; font-weight:bold; line-height:1.7; margin:6px 0; }
  .translit { color:#6b5a4e; font-size:0.82rem; font-style:italic; margin:8px 0 0; }
  .share-btn {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; max-width:420px; padding:16px; background:#d4380d; color:#fff;
    border:none; border-radius:50px; font-size:1.1rem; font-weight:bold;
    font-family:inherit; cursor:pointer; box-shadow:0 4px 18px rgba(212,56,13,0.35);
    margin-bottom:12px; transition:background 0.2s;
  }
  .share-btn:active { background:#b12f0a; }
  .share-btn:disabled { background:#aaa; box-shadow:none; }
  .open-btn {
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; max-width:420px; padding:14px; background:none; color:#e06b00;
    border:2px solid #e06b00; border-radius:50px; font-size:1rem; font-weight:bold;
    font-family:inherit; cursor:pointer; text-decoration:none;
  }
  .status { color:#888; font-size:0.8rem; margin-top:16px; text-align:center; }
  .loading { color:#c8964a; text-align:center; padding:40px 0; font-style:italic; }
</style>
</head>
<body data-counter-page="today">

<h1 id="pageTitle">திருக்குறள் · Today's Kural</h1>
<div class="subtitle" id="dayLabel">Loading…</div>

<div class="card" id="kuralCard">
  <div class="loading">Loading kural…</div>
</div>

<button class="share-btn" id="shareBtn" disabled>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
  <span id="shareBtnLabel">Share</span>
</button>

<a class="open-btn" id="openBtn" href="#" target="_blank">
  <span id="openBtnLabel">📖 Open Full Kural Page</span>
</a>

<div class="status" id="statusMsg"></div>
<div class="status" id="pageViewCount" style="opacity:0.6"></div>

<script>
const SITE = 'https://tirukkural.in';
let currentKural = null;

async function init() {
  try {
    const d = await TodayKural.fetchData();
    currentKural = d.kural;
    window.kuralData = window.kuralData || {};
    window.kuralData[d.kuralNum - 1] = d.kural;

    document.documentElement.lang = d.lang === 'ta' ? 'ta' : d.lang === 'ar' ? 'ar' : 'en';
    document.getElementById('pageTitle').textContent = d.tr('site_title') + ' · ' + d.tr('today');
    document.getElementById('shareBtnLabel').textContent = d.tr('share');
    document.getElementById('openBtnLabel').textContent = d.tr('read');
    document.getElementById('dayLabel').textContent = d.tr('kural') + ' ' + d.kuralNum + ' / 1330';
    document.getElementById('openBtn').href = SITE + '/kural.html?id=' + d.kuralNum;

    document.getElementById('kuralCard').innerHTML = TodayKural.cardHTML(d);
    document.getElementById('shareBtn').disabled = false;
  } catch (e) {
    document.getElementById('kuralCard').innerHTML =
      '<p style="color:#c00;padding:20px">Could not load kural data.<br>Check your internet connection.</p>';
    document.getElementById('statusMsg').textContent = e.message;
  }
}

document.getElementById('shareBtn').addEventListener('click', () => {
  window.currentId = currentKural.Number;
  window.executeShare(currentKural.Number, document.getElementById('shareBtn'));
});

init();
</script>
<script src="kural-share.js?v=2.0"></script>
    <script src="page-counter.js?v=1.0"></script>
</body>
</html>
